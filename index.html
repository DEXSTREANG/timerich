<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>TimeRich 타임리치</title>
<meta name="description" content="일상의 시간을 벌어 드리는 프로그램, 타임리치">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{min-height:100vh;display:flex;align-items:center;justify-content:center;background:#0f1420;color:#eef1f7;font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",sans-serif;word-break:keep-all;padding:32px}
.w{max-width:560px;text-align:center}
.logo{font-size:44px;font-weight:900;letter-spacing:-1px}
.logo span{color:#ffad4d}
.ko{margin-top:6px;font-size:16px;color:#8f9bb3;letter-spacing:4px}
h1{margin-top:40px;font-size:26px;line-height:1.5;font-weight:800}
p{margin-top:16px;font-size:17px;line-height:1.7;color:#aab5ca}
.soon{display:inline-block;margin-top:36px;padding:10px 22px;border-radius:999px;border:1px solid #33405a;color:#c9d3e6;font-size:15px}
</style>
</head>
<body>
<div class="w">
<div class="logo">Time<span>Rich</span></div>
<div class="ko">타임리치</div>
<h1>돈 말고, 시간을 벌어 드립니다</h1>
<p>매일 반복되는 일을 대신 해 주는 프로그램을 만듭니다.</p>
<div class="soon">곧 문을 엽니다</div>
</div>
</body>
</html>
