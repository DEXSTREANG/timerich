:root{--bg:#0E1014;--pp:#171A20;--pp2:#20242C;--ln:#2C313B;--tx:#E6E9EE;--sub:#98A1AE;--red:#FF6B6B;--grn:#40C980;--ink:#E6E9EE;--line:#2C313B;--green:#40C980;--teal:#E6E9EE;--topH:6rem}
